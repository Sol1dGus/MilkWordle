services:
  - type: web
    name: wordly-moloko
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
